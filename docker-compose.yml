services:
  # Webサーバー（Nginx）
  web:
    # NginxのAlpineイメージを使用
    image: nginx:alpine
    # ホストの8000ポートをコンテナの80ポートにマッピング
    ports:
      - "8000:80"
    # ソースコードとNginxの設定ファイルをコンテナにマウント
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    # appサービスに依存
    depends_on:
      - app

    
  # アプリケーションサーバー（PHP）
  app:
    # PHPの公式イメージを使用
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    # ソースコードとPHPの設定ファイルをコンテナにマウント
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    # データベースサービスに依存
    depends_on:
      - db

  # データベースサーバー（MySQL）
  db:
    # MySQLの公式イメージを使用
    image: mysql:8.0
    # 環境変数でMySQLのルートパスワードとデータベース名を設定
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: phper
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    # データ永続化のためにボリュームをマウント
    volumes:
      - db_store:/var/lib/mysql
    ports:
      - "3306:3306"

# ボリューム定義
volumes:
  db_store: